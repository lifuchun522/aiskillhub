  "rules": [
    {
      "id": "RULE-CONTRACT-APPROVAL-LEVEL",
      "name": "合同审批层级判定",
      "ruleType": "VALIDATION",
      "description": "判断合同含税总金额是否大于等于 100 万元，决定是否需要总经理审批",
      "inputParams": [
        {
          "name": "totalAmount",
          "type": "Decimal",
          "sourceField": "Contract.totalAmount",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "totalAmount >= 1000000\n",
      "reusedBy": [
        "Contract_Submit",
        "Contract_Resubmit",
        "Contract_ApproveFinance"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-CONTRACT-INVOICE-ELIGIBLE",
      "name": "合同可开票资格",
      "ruleType": "VALIDATION",
      "description": "判断合同是否已纳入管理且未作废、未归档，从而允许开票",
      "inputParams": [
        {
          "name": "contractStatus",
          "type": "Enum",
          "sourceField": "Contract.status",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "contractStatus == '已纳入管理' OR contractStatus == '已结清'\n",
      "reusedBy": [
        "Invoice_SaveAsDraft",
        "Invoice_Submit",
        "Invoice_Resubmit"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-PAYSTAGE-REMAIN-QUOTA",
      "name": "付款阶段剩余可开票额度",
      "ruleType": "VALIDATION",
      "description": "判断本次分摊加历史有效分摊是否不超过阶段应付金额",
      "inputParams": [
        {
          "name": "stageAmount",
          "type": "Decimal",
          "sourceField": "PaymentStage.stageAmount",
          "required": true
        },
        {
          "name": "historicalAllocation",
          "type": "Decimal",
          "sourceField": "Invoice.aggregatedAllocation",
          "required": true
        },
        {
          "name": "currentAllocation",
          "type": "Decimal",
          "sourceField": "InvoiceStageAllocation.allocatedAmount",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "historicalAllocation + currentAllocation <= stageAmount\n",
      "reusedBy": [
        "Invoice_SaveAsDraft",
        "Invoice_Submit",
        "Invoice_Resubmit"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-INVOICE-REMAIN-RECEIPT-QUOTA",
      "name": "开票剩余可收款额度",
      "ruleType": "VALIDATION",
      "description": "判断本次收款加历史有效收款是否不超过开票金额",
      "inputParams": [
        {
          "name": "invoiceAmount",
          "type": "Decimal",
          "sourceField": "Invoice.invoiceAmount",
          "required": true
        },
        {
          "name": "historicalReceipt",
          "type": "Decimal",
          "sourceField": "Receipt.aggregatedAmount",
          "required": true
        },
        {
          "name": "currentReceipt",
          "type": "Decimal",
          "sourceField": "Receipt.receiptAmount",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "historicalReceipt + currentReceipt <= invoiceAmount\n",
      "reusedBy": [
        "Receipt_Record"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-INVOICE-RECEIPT-STATUS",
      "name": "开票收款状态判定",
      "ruleType": "DERIVATION",
      "description": "根据有效收款累计相对开票金额判定开票处于未收款、部分收款或全部收齐",
      "inputParams": [
        {
          "name": "invoiceAmount",
          "type": "Decimal",
          "sourceField": "Invoice.invoiceAmount",
          "required": true
        },
        {
          "name": "receivedAmount",
          "type": "Decimal",
          "sourceField": "Receipt.aggregatedAmount",
          "required": true
        }
      ],
      "outputType": "Enum",
      "expression": "IF receivedAmount <= 0 THEN '未收款'\nELSE IF receivedAmount >= invoiceAmount THEN '已收款'\nELSE '部分收款'\n",
      "reusedBy": [
        "Invoice_UpdateReceiptStatus"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-CONTRACT-VOID-ELIGIBLE",
      "name": "合同作废资格",
      "ruleType": "VALIDATION",
      "description": "判断是否不存在已批准开票或有效收款，从而允许作废合同",
      "inputParams": [
        {
          "name": "approvedInvoiceCount",
          "type": "Integer",
          "sourceField": "Invoice.approvedCount",
          "required": true
        },
        {
          "name": "validReceiptCount",
          "type": "Integer",
          "sourceField": "Receipt.validCount",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "approvedInvoiceCount == 0 AND validReceiptCount == 0\n",
      "reusedBy": [
        "Contract_VoidOrArchive"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-INVOICE-VOID-ELIGIBLE",
      "name": "开票作废资格",
      "ruleType": "VALIDATION",
      "description": "判断开票是否存在有效收款，从而允许作废",
      "inputParams": [
        {
          "name": "validReceiptCount",
          "type": "Integer",
          "sourceField": "Receipt.validCount",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "validReceiptCount == 0\n",
      "reusedBy": [
        "Invoice_Void"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-INVOICE-TAXRATE-CONSISTENT",
      "name": "开票税率一致性",
      "ruleType": "VALIDATION",
      "description": "判断开票税率是否等于合同税率",
      "inputParams": [
        {
          "name": "contractTaxRate",
          "type": "Decimal",
          "sourceField": "Contract.taxRate",
          "required": true
        },
        {
          "name": "invoiceTaxRate",
          "type": "Decimal",
          "sourceField": "Invoice.invoiceTaxRate",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "invoiceTaxRate == contractTaxRate\n",
      "reusedBy": [
        "Invoice_SaveAsDraft",
        "Invoice_Submit",
        "Invoice_Resubmit"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-APPROVAL-SOD",
      "name": "提交审批职责分离",
      "ruleType": "VALIDATION",
      "description": "判断当前审批人是否不是该业务记录的提交人",
      "inputParams": [
        {
          "name": "submitterId",
          "type": "String",
          "sourceField": "Contract.registrantId",
          "required": true
        },
        {
          "name": "approverId",
          "type": "String",
          "sourceField": "Actor.actorId",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "approverId != submitterId\n",
      "reusedBy": [
        "Contract_ApproveFinance",
        "Contract_ApproveGeneralManager",
        "Invoice_ApproveFinance"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-CONTRACT-SETTLEMENT",
      "name": "合同结清资格判定",
      "ruleType": "VALIDATION",
      "description": "判断所有付款阶段是否均已足额开票，且所有已批准未作废开票均已全部收齐",
      "inputParams": [
        {
          "name": "allStagesFullyInvoiced",
          "type": "Boolean",
          "sourceField": "PaymentStage.invoiceStatus",
          "required": true
        },
        {
          "name": "allInvoicesFullyReceived",
          "type": "Boolean",
          "sourceField": "Invoice.receivedFlag",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "allStagesFullyInvoiced == true AND allInvoicesFullyReceived == true\n",
      "reusedBy": [
        "PaymentStage_UpdateInvoiceStatus",
        "Invoice_UpdateReceiptStatus",
        "Contract_UpdateSettlementStatus"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-ALLOCATION-CONTRACT-CONSISTENT",
      "name": "分摊所属合同一致性",
      "ruleType": "VALIDATION",
      "description": "判断分摊记录、开票和付款阶段是否属于同一合同",
      "inputParams": [
        {
          "name": "invoiceContractId",
          "type": "String",
          "sourceField": "Invoice.contractId",
          "required": true
        },
        {
          "name": "allocationContractId",
          "type": "String",
          "sourceField": "InvoiceStageAllocation.contractId",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "allocationContractId == invoiceContractId\n",
      "reusedBy": [
        "Invoice_SaveAsDraft",
        "Invoice_Submit",
        "Invoice_Resubmit"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-RECEIPT-CONTRACT-CONSISTENT",
      "name": "收款所属合同一致性",
      "ruleType": "VALIDATION",
      "description": "判断收款所选合同是否等于对应开票所属合同",
      "inputParams": [
        {
          "name": "receiptContractId",
          "type": "String",
          "sourceField": "Receipt.contractId",
          "required": true
        },
        {
          "name": "invoiceContractId",
          "type": "String",
          "sourceField": "Invoice.contractId",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "receiptContractId == invoiceContractId\n",
      "reusedBy": [
        "Receipt_Record"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    },
    {
      "id": "RULE-OWNER-DEPT-CONSISTENT",
      "name": "责任人部门一致性",
      "ruleType": "VALIDATION",
      "description": "判断责任人所属部门是否等于合同所属部门",
      "inputParams": [
        {
          "name": "ownerDepartmentId",
          "type": "String",
          "sourceField": "Employee.departmentId",
          "required": true
        },
        {
          "name": "contractDepartmentId",
          "type": "String",
          "sourceField": "Contract.departmentId",
          "required": true
        }
      ],
      "outputType": "Boolean",
      "expression": "ownerDepartmentId == contractDepartmentId\n",
      "reusedBy": [
        "Contract_SaveAsDraft",
        "Contract_Submit",
        "Contract_Resubmit"
      ],
      "version": "1.0",
      "ruleFamily": "rules"
    }

  "flows": [
    {
      "id": "FLOW-CONTRACT-001",
      "name": "合同全生命周期流程",
      "flowType": "COLLABORATION",
      "description": "从合同创建、审批、生效、开票和收款到合同关闭的端到端协同流程",
      "businessObjectRefs": [
        "AGG-CONTRACT-001",
        "AGG-INVOICE-001",
        "AGG-RECEIPT-001"
      ],
      "roleRefs": [
        "ROLE-SALES",
        "ROLE-FINANCE",
        "ROLE-FINANCE-MANAGER",
        "ROLE-GENERAL-MANAGER"
      ],
      "trigger": {
        "triggerType": "MANUAL"
      },
      "preconditions": [
        "销售合同已完成线下签字盖章，具备登记条件"
      ],
      "postconditions": [
        "合同已归档或流程已明确终止"
      ],
      "startActivity": "A01",
      "endActivities": [
        "A09"
      ],
      "activities": [
        {
          "activityId": "A01",
          "name": "开始",
          "activityType": "START",
          "nextActivities": [
            "A02"
          ]
        },
        {
          "activityId": "A02",
          "name": "创建合同（保存草稿/提交审批）",
          "activityType": "USER_TASK",
          "roleRef": "ROLE-SALES",
          "behaviorRef": "Contract_Submit",
          "nextActivities": [
            "A03"
          ]
        },
        {
          "activityId": "A03",
          "name": "合同登记审批",
          "activityType": "SUB_FLOW_CALL",
          "subFlowRef": "FLOW-CONTRACT-APPROVAL-001",
          "nextActivities": [
            "A04"
          ]
        },
        {
          "activityId": "A04",
          "name": "审批结果判断",
          "activityType": "GATEWAY",
          "branches": [
            {
              "branchName": "审批通过",
              "conditionExpression": "approval.outcome == 'APPROVE'",
              "targetActivity": "A05",
              "isDefault": true
            },
            {
              "branchName": "驳回后修改重提",
              "conditionExpression": "approval.outcome == 'REJECT'",
              "targetActivity": "A02",
              "isDefault": false
            },
            {
              "branchName": "终止且不再提交",
              "conditionExpression": "approval.outcome == 'TERMINATE'",
              "targetActivity": "A09",
              "isDefault": false
            }
          ]
        },
        {
          "activityId": "A05",
          "name": "开票与收款循环",
          "activityType": "SUB_FLOW_CALL",
          "subFlowRef": "FLOW-CONTRACT-INVOICE-002",
          "nextActivities": [
            "A06"
          ]
        },
        {
          "activityId": "A06",
          "name": "合同结清判断",
          "activityType": "GATEWAY",
          "branches": [
            {
              "branchName": "满足结清条件",
              "ruleRef": "RULE-CONTRACT-SETTLEMENT",
              "targetActivity": "A07",
              "isDefault": false
            },
            {
              "branchName": "未结清，继续开票收款",
              "conditionExpression": null,
              "targetActivity": "A05",
              "isDefault": true
            }
          ]
        },
        {
          "activityId": "A07",
          "name": "合同结清（由同步联动自动触发）",
          "activityType": "SYSTEM_TASK",
          "behaviorRef": "Contract_UpdateSettlementStatus",
          "nextActivities": [
            "A08"
          ]
        },
        {
          "activityId": "A08",
          "name": "合同作废或归档",
          "activityType": "USER_TASK",
          "roleRef": "ROLE-FINANCE-MANAGER",
          "behaviorRef": "Contract_VoidOrArchive",
          "nextActivities": [
            "A09"
          ]
        },
        {
          "activityId": "A09",
          "name": "结束",
          "activityType": "END",
          "nextActivities": []
        }
      ]
    },

function group(title,type,items,open=false){return `<li><details ${open?'open':''}><summary>${badge(type)} ${esc(title)} <span class="id">${items.length}</span></summary><ul>${items.map(o=>leaf(type,o)).join('')||'<li class="leaf">—</li>'}</ul></details></li>`}
function screenBranch(s){return `<li><details><summary>${badge('screen')} ${esc(s.name)} <span class="id">${esc(s.screenId)}</span></summary><ul>${leaf('screen',s)}${group('界面元素','element',arr(s.elements))}${group('操作','action',arr(s.actions))}</ul></details></li>`}
function menuBranch(m){return `<li><details><summary>${badge('menu')} ${esc(m.name)} <span class="id">${esc(m.menuId)}</span></summary><ul>${leaf('menu',m)}${arr(m.children).map(menuBranch).join('')}</ul></details></li>`}
function buildTree(){const roots=[['界面模型 MU','screen',DATA.screens,DATA.screens.map(screenBranch).join('')],['对象模型 M1','aggregate',DATA.aggregates],['行为模型 M2','behavior',DATA.behaviors],['规则模型 M3','rule',DATA.rules],['主体与权限 M5','role',DATA.roles],['流程模型 M6','flow',DATA.flows],['查询报表 M7','report',DATA.reports],['数据字典','dictionary',DATA.dictionaries],['对象关联','association',DATA.associations],['菜单导航','menu',DATA.menus,DATA.menus.map(menuBranch).join('')],['参与者','actor',DATA.actors],['权限索引','permission',DATA.permissions]];$('#tree').innerHTML=roots.map((r,i)=>r[3]!==undefined?`<li><details ${i===0?'open':''}><summary>${badge(r[1])} ${r[0]} <span class="id">${r[2].length}</span></summary><ul>${r[3]}</ul></details></li>`:group(r[0],r[1],r[2],i<2)).join('')}
function ref(id,text=id){const ks=byId.get(id);return `<button class="ref ${ks?'':'dangling'}" ${ks?`data-ref="${esc(ks[0])}"`:''}>${esc(text)}</button>`}
function refs(ids){const xs=arr(ids).filter(Boolean);return xs.length?`<div class="refs">${xs.map(x=>typeof x==='object'?ref(x.id||x.objectRef||x.behaviorRef||x.roleRef||x.screenRef||x.ruleRef, x.name||x.id||x.objectRef||x.behaviorRef||x.roleRef||x.screenRef||x.ruleRef):ref(x)).join('')}</div>`:'—'}
function kv(rows){return `<dl class="kv">${rows.filter(x=>x[1]!==undefined).map(([a,b])=>`<dt>${esc(a)}</dt><dd>${typeof b==='string'?b:esc(JSON.stringify(b))}</dd>`).join('')}</dl>`}
function card(title,body){return `<section class="card"><h3>${esc(title)}</h3>${body}</section>`}
function table(items,cols){if(!items.length)return '<div class="empty">无数据</div>';return `<div class="table-wrap"><table class="data"><thead><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${items.map(x=>`<tr>${cols.map(c=>`<td>${typeof c[1](x)==='string'?c[1](x):esc(c[1](x))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function hero(type,o){const id=o[defs[type]?.[0]]||o.id||'';return `<div class="crumbs"><span>${esc(DATA.meta.domain)}</span><span>${type.toUpperCase()}</span></div><div class="hero"><div>${badge(type)}<h2>${esc(label(type,o))}</h2><div class="id">${esc(id)}</div></div>${id?`<button class="btn copy" data-copy="${esc(id)}">复制 ID</button>`:''}</div>`}
function linkedBehaviors(owner){return DATA.behaviors.filter(b=>b.ownerEntity===owner)}
function linkedReports(owner){return DATA.reports.filter(r=>arr(r.sourceObjects).some(x=>(x.objectRef||x)===owner))}function linkedActions(behaviorId){return DATA.screens.flatMap(s=>arr(s.actions).filter(a=>a.behaviorRef===behaviorId).map(a=>({screen:s,action:a}))) }
function dictionaryRows(o){return arr(o.types).flatMap(t=>arr(t.items).map(x=>({...x,typeCode:t.typeCode,typeName:t.typeName})))}
function entityCards(o){return arr(o.entities).map(e=>card(`${e.name} · ${e.localId}`,kv([['别名',esc(e.alias)],['基数',esc(e.cardinality)],['级联删除',e.cascadeDelete?'是':'否'],['说明',esc(e.description)]])+table(arr(e.attributes),[['字段',x=>`<b>${esc(x.label||x.name)}</b><div class="id">${esc(x.name)}</div>`],['类型',x=>esc(x.type)],['必填',x=>x.required?'是':'否'],['默认值',x=>esc(x.defaultValue)],['枚举/引用',x=>x.targetAggregate?ref(x.targetAggregate):esc(arr(x.enumValues).join(', ')||'—')]]))).join('')}
function flowBranches(o){return arr(o.activities).flatMap(a=>arr(a.branches).map(x=>({...x,activityId:a.activityId,activityName:a.name})))}
function render(type,o){let body='';
 if(type==='screen'){body=card('界面原型',prototype(o))+`<div class="grid">${card('基本信息',kv([['类型',esc(o.screenType)],['元素',String(arr(o.elements).length)],['操作',String(arr(o.actions).length)]]))}${card('操作',table(arr(o.actions),[['操作',x=>ref(x.actionId,x.name)],['行为',x=>ref(x.behaviorRef)],['权限',x=>refs(x.permissionRef)]]))}</div>`+card('元素',table(arr(o.elements),[['控件',x=>`<b>${esc(x.label||x.id)}</b><div class="id">${esc(x.id)}</div>`],['类型',x=>esc(x.type)],['I/O',x=>esc(x.io)],['数据绑定',x=>bindingRef(x.dataBinding)],['数据源',x=>x.dataSource?ref(x.dataSource):'—']]));}
 else if(type==='element'){body=`<div class="grid">${card('控件定义',kv([['类型',esc(o.type)],['标签',esc(o.label)],['输入输出',esc(o.io)],['必填',esc(o.required)],['数据绑定',bindingRef(o.dataBinding)],['数据源',o.dataSource?ref(o.dataSource):'—']]))}</div>`}
 else if(type==='action'){body=card('当前调用链',chain([['界面',store.get(key(type,o))?.parent],['操作',key(type,o)],['行为',byId.get(o.behaviorRef)?.[0]],...arr(o.permissionRef).map(x=>['权限',byId.get(x)?.[0]])]))+`<div class="grid">${card('操作定义',kv([['类型',esc(o.actionType)],['行为',ref(o.behaviorRef)],['权限',refs(o.permissionRef)]]))}</div>`}
 else if(type==='behavior'){const reports=DATA.reports.filter(r=>r.behaviorRef===o.id);const flows=DATA.flows.filter(f=>arr(f.activities).some(a=>a.behaviorRef===o.id));const actions=linkedActions(o.id);body=card('行为调用链',chain([['对象',byId.get(o.ownerEntity)?.[0]],['行为',key(type,o)],...arr(o.appliedRules).map(x=>['规则',byId.get(x)?.[0]]),...arr(o.requiredPermissions).map(x=>['权限',byId.get(x)?.[0]]),...reports.map(x=>['报表',key('report',x)])]))+`<div class="grid">${card('行为定义',kv([['所属对象',ref(o.ownerEntity)],['行为类型',esc(o.behaviorType)],['触发类型',esc(o.triggerType)],['查询报表',o.queryReportRef?ref(o.queryReportRef):'—']]))}${card('规则与权限',kv([['规则',refs(o.appliedRules)],['权限',refs(o.requiredPermissions)]]))}</div>${card('同步联动',table(arr(o.syncTriggers),[['规则',x=>x.ruleRef?ref(x.ruleRef):'—'],['行为',x=>x.behaviorRef?ref(x.behaviorRef):'—'],['说明',x=>esc(x.description)]]))}${card('前置条件',list(o.preconditions))}${card('后置条件',list(o.postconditions))}${card('参与流程',refs(flows.map(x=>x.id)))}${card('界面入口',table(actions,[['界面',x=>ref(x.screen.screenId,x.screen.name)],['操作',x=>`<button class="ref" data-ref="${esc(key('action',x.action))}">${esc(x.action.name)}</button>`]]))}`}
 else if(type==='aggregate'){const bs=linkedBehaviors(o.id), rs=linkedReports(o.id), ass=DATA.associations.filter(a=>a.sourceAggregate===o.id||a.targetAggregate===o.id);body='<div class=\"notice\">对象详情严格展示 M1 已声明的聚合、属性、约束和对象关联。</div>'+`<div class="grid">${card('聚合信息',kv([['别名',esc(o.alias)],['类型',esc(o.aggregateType)],['标签',esc(arr(o.tags).join(', '))],['生命周期',esc(arr(o.lifecycle).join(' → '))],['说明',esc(o.description)]]))}${card('关联穿透',kv([['行为',refs(bs.map(x=>x.id))],['报表',refs(rs.map(x=>x.id))],['对象关联',refs(ass.map(x=>x.id))]]))}</div>`+card('属性',table(arr(o.attributes),[['字段',x=>`<b>${esc(x.label||x.name)}</b><div class="id">${esc(x.name)}</div>`],['类型',x=>esc(x.type)],['必填/唯一',x=>`${x.required?'必填':'可选'} / ${x.unique?'唯一':'非唯一'}`],['默认值',x=>esc(x.defaultValue)],['字典/引用',x=>x.dictionaryRef?ref(x.dictionaryRef.dictionaryId):(x.targetAggregate?ref(x.targetAggregate):'—')],['枚举值',x=>esc(arr(x.enumValues).join(', '))],['字段规则',x=>refs(x.refRules)],['说明',x=>esc(x.description)]]))+card('子实体',entityCards(o)||'<div class="empty">无子实体</div>')+card('聚合约束',table(arr(o.invariants),[['名称',x=>esc(x.name)],['表达式',x=>`<span class="mono">${esc(x.expression)}</span>`],['校验时点',x=>esc(x.enforcedAt)],['提示信息',x=>esc(x.violationMessage)]]));}
 else if(type==='rule'){body=`<div class="grid">${card('规则定义',kv([['类型',esc(o.ruleType||o.ruleFamily)],['说明',esc(o.description)],['输出',esc(o.outputType)],['版本',esc(o.version)]]))}${card('复用关系',refs(o.reusedBy))}</div>${card('表达式',`<pre class="code">${esc(o.expression)}</pre>`)}${card('输入参数',table(arr(o.inputParams),[['参数',x=>esc(x.name)],['类型',x=>esc(x.type)],['来源字段',x=>esc(x.sourceField)],['必填',x=>x.required?'是':'否']]))}`}
 else if(type==='permission'){const roles=DATA.roles.filter(r=>arr(r.permissions).includes(o.permissionId));body=`<div class="grid">${card('权限定义',kv([['目标类型',esc(o.targetType)],['授权目标',o.targetRef?ref(o.targetRef):'—'],['数据范围',esc(o.dataScope)],['ABAC 条件',`<span class="mono">${esc(o.abacCondition)}</span>`]]))}${card('被角色持有',refs(roles.map(x=>x.roleId)))}</div>`}
 else if(type==='role'){const flows=DATA.flows.filter(f=>arr(f.roleRefs).includes(o.roleId)||arr(f.activities).some(a=>a.roleRef===o.roleId));body=`<div class="grid">${card('角色权限',refs(o.permissions))}${card('关联参与者',refs(DATA.actors.filter(a=>arr(a.roles).includes(o.roleId)).map(a=>a.actorId)))}${card('参与流程',refs(flows.map(f=>f.id)))}</div>`}
 else if(type==='actor'){body=card('参与者定义',kv([['类型',esc(o.actorType)],['角色',refs(o.roles)]]))}
 else if(type==='flow'){const branches=flowBranches(o);body=`<div class="grid">${card('流程定义',kv([['类型',esc(o.flowType)],['说明',esc(o.description)],['业务对象',refs(o.businessObjectRefs)],['角色',refs(o.roleRefs)],['触发器',`<span class="mono">${esc(JSON.stringify(o.trigger||{}))}</span>`],['起点',esc(o.startActivity)],['终点',esc(arr(o.endActivities).join(', '))]]))}${card('流程条件',kv([['前置条件',list(o.preconditions)],['后置条件',list(o.postconditions)]]))}</div>${card('活动链',chain(arr(o.activities).map(a=>[a.name,null,a.activityType])))}${card('活动明细',table(arr(o.activities),[['活动',a=>`<b>${esc(a.name)}</b><div class="id">${esc(a.activityId)}</div>`],['类型',a=>esc(a.activityType)],['行为/子流程',a=>a.behaviorRef?ref(a.behaviorRef):(a.subFlowRef?ref(a.subFlowRef):'—')],['角色',a=>a.roleRef?ref(a.roleRef):'—'],['审批结果',a=>esc(arr(a.approvalOutcomes).join(', '))],['下一步',a=>esc(arr(a.nextActivities).join(', ')||'—')]]))}${card('网关分支',table(branches,[['活动',x=>`${esc(x.activityName)}<div class="id">${esc(x.activityId)}</div>`],['分支',x=>esc(x.branchName)],['条件/规则',x=>x.ruleRef?ref(x.ruleRef):`<span class="mono">${esc(x.conditionExpression)}</span>`],['目标活动',x=>esc(x.targetActivity)],['默认',x=>x.isDefault?'是':'否']]))}`}
 else if(type==='report'){const conditions=[...arr(o.conditions).map(x=>({...x,scope:'WHERE'})),...arr(o.having).map(x=>({...x,scope:'HAVING'}))];body=`<div class="grid">${card('报表定义',kv([['别名',esc(o.alias)],['类型',esc(o.objectType)],['版本',esc(o.version)],['说明',esc(o.description)],['绑定行为',o.behaviorRef?ref(o.behaviorRef):'—']]))}${card('分组与分页',kv([['分组字段',esc(arr(o.groupBy).join(', '))],['排序',esc(arr(o.orderBy).map(x=>`${x.expression} ${x.direction}`).join(', '))],['分页',`<span class="mono">${esc(JSON.stringify(o.pagination||{}))}</span>`],['报表选项',`<span class="mono">${esc(JSON.stringify(o.reportOptions||{}))}</span>`]]))}</div>${card('来源对象',table(arr(o.sourceObjects),[['对象',x=>ref(x.objectRef)],['别名',x=>esc(x.alias)],['主对象',x=>x.primary?'是':'否'],['预聚合',x=>`<span class="mono">${esc(JSON.stringify(x.preAggregation||{}))}</span>`]]))}${card('对象连接',table(arr(o.joins),[['ID',x=>esc(x.joinId)],['类型',x=>esc(x.joinType)],['左侧',x=>esc(x.leftSource)],['右侧',x=>esc(x.rightSource)],['连接条件',x=>`<span class="mono">${esc(x.conditionExpression)}</span>`]]))}${card('查询参数',table(arr(o.parameters),[['参数',x=>esc(x.label||x.name)],['类型',x=>esc(x.dataType)],['必填',x=>x.required?'是':'否'],['来源字段',x=>esc(x.sourceField)],['操作符',x=>esc(arr(x.allowedOperators).join(', '))]]))}${card('查询条件',table(conditions,[['范围',x=>esc(x.scope)],['ID',x=>esc(x.conditionId)],['左表达式',x=>`<span class="mono">${esc(x.leftExpression)}</span>`],['操作符',x=>esc(x.operator)],['参数/固定值',x=>esc(x.parameterRef??x.fixedValue)],['连接',x=>esc(x.logicalConnector)],['空值跳过',x=>x.skipWhenParameterEmpty?'是':'否']]))}${card('结果列',table(arr(o.resultColumns),[['列',x=>esc(x.label||x.name)],['类型',x=>esc(x.dataType)],['来源',x=>esc(x.sourceExpression||x.sourceField)],['聚合',x=>esc(x.aggregateFunction)],['格式',x=>esc(x.format)],['可排序',x=>x.sortable?'是':'否']]))}`}
 else if(type==='dictionary'){body=`<div class="grid">${card('字典类型',table(arr(o.types),[['类型编码',x=>esc(x.typeCode)],['类型名称',x=>esc(x.typeName)],['字典项数',x=>String(arr(x.items).length)]]))}</div>`+card('字典项',table(dictionaryRows(o),[['类型',x=>`${esc(x.typeName)}<div class="id">${esc(x.typeCode)}</div>`],['编码',x=>esc(x.code||x.value||x.id)],['名称',x=>esc(x.name||x.label)],['启用',x=>x.enabled===false?'否':'是'],['排序',x=>esc(x.order??x.sortOrder)]]))}
 else if(type==='association'){body=card('对象关联',kv([['来源',ref(o.sourceAggregate)],['来源角色',esc(o.sourceRole)],['目标',ref(o.targetAggregate)],['目标角色',esc(o.targetRole)],['关系',esc(o.associationType)],['基数',esc(o.cardinality)],['引用字段',esc(o.referenceField)]]))}
 else if(type==='menu'){body=card('菜单定义',kv([['菜单编号',esc(o.menuId)],['目标界面',o.screenRef?ref(o.screenRef):'—'],['子菜单数',String(arr(o.children).length)]]))+card('子菜单',table(arr(o.children),[['菜单',x=>ref(x.menuId,x.name)],['编号',x=>esc(x.menuId)],['目标界面',x=>x.screenRef?ref(x.screenRef):'—']]))}
 $('#detail').innerHTML=hero(type,o)+body;bindDetail()}
function list(xs){return arr(xs).length?`<ul>${arr(xs).map(x=>`<li>${esc(typeof x==='object'?JSON.stringify(x):x)}</li>`).join('')}</ul>`:'—'}
function bindingRef(v){if(!v)return '—';const alias=String(v).split('.')[0], agg=DATA.aggregates.find(a=>a.alias===alias);return agg?ref(agg.id,v):`<span class="mono">${esc(v)}</span>`}
function chain(items){const good=items.filter(x=>x[1]||x[2]);return `<div class="chain">${good.map((x,i)=>`${i?'<span class="arrow">→</span>':''}<div class="step" ${x[1]?`data-ref="${esc(x[1])}"`:''}>${badge(x[2]?x[2].toLowerCase():(store.get(x[1])?.type||'step'))}<b>${esc(x[0])}</b><div class="id">${esc(x[1]?.split(':').slice(1).join(':')||x[2]||'')}</div></div>`).join('')}</div>`}
function prototype(s){return `<div class="proto-head"><button class="btn" data-view="modern">现代渲染</button><button class="btn" data-view="raw">原始 ASCII</button><span class="spacer"></span><button class="btn" data-size="-1">A−</button><button class="btn" data-size="1">A+</button></div><div class="modern-proto">${modern(s)}</div><pre class="code raw hidden">${esc(s.layout||'未提供 layout，已使用元素驱动渲染。')}</pre>`}
function modern(s){const els=new Map(arr(s.elements).map(e=>[e.id,e]));let rows=[],section='';const lines=String(s.layout||'').split('\n').map(x=>x.replace(/[┌┐└┘├┤─│]/g,' ').trim()).filter(Boolean);for(const line of lines){const tokens=[...line.matchAll(/[\[\(\{]([^\]\)\}]+)[\]\)\}]|@([\w-]+)/g)].map(m=>(m[1]||m[2]).trim().split(/\s+/)[0]);if(!tokens.length){section=line;continue}rows.push({section,tokens})}if(!rows.length&&s.elements?.length)rows=[{section:s.name,tokens:s.elements.map(e=>e.id)}];let last='';return `<div class="ui-win"><div class="ui-titlebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="ui-title">${esc(s.name)} · ${esc(s.screenId)}</span><span class="ui-chip">当前用户</span></div><div class="ui-body">${rows.map(r=>{let h='';if(r.section&&r.section!==last){last=r.section;h=`<div class="ui-section">${esc(r.section.slice(0,70))}</div>`}return h+`<div class="ui-row">${r.tokens.map(t=>control(els.get(t)||{id:t,type:'TEXTBOX',label:t})).join('')}</div>`}).join('')}</div></div>`}
function control(e){const t=e.type||'';if(t==='BUTTON')return `<button class="ui-button ${/提交|查询|保存|批准|登记/.test(e.label||'')?'primary':''}">${esc(e.label||e.id)}</button>`;if(t==='GRID'||t==='TABLE'||t==='REPORT_VIEWER')return `<table class="ui-grid"><tr><th>${esc(e.label||e.id)}</th><th>状态</th><th>金额/摘要</th></tr><tr><td>示例记录</td><td>—</td><td>—</td></tr><tr><td>…</td><td>…</td><td>…</td></tr></table>`;const cls=/COMBO|SELECT|DATE|POPUP/.test(t)?'ui-select':'ui-input';return `<label class="ui-field"><span class="ui-label">${esc(e.label||e.id)}</span><span class="${cls}">${esc(e.id)}${cls==='ui-select'?' ▾':''}</span></label>`}
async function copyText(text){
 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return true}}catch(_error){}
 const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
 try{return document.execCommand('copy')}finally{area.remove()}
}function bindDetail(){$('#detail').querySelectorAll('[data-ref]').forEach(x=>x.onclick=()=>select(x.dataset.ref));const c=$('[data-copy]');if(c)c.onclick=()=>copyText(c.dataset.copy);$('#detail').querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>{const modern=$('.modern-proto'),raw=$('.raw');modern.classList.toggle('hidden',x.dataset.view==='raw');raw.classList.toggle('hidden',x.dataset.view!=='raw')});$('#detail').querySelectorAll('[data-size]').forEach(x=>x.onclick=()=>{const p=$('.ui-body');p.style.fontSize=(parseFloat(getComputedStyle(p).fontSize)+Number(x.dataset.size))+'px'})}
function select(k){const n=store.get(k);if(!n)return;document.querySelectorAll('.leaf.active').forEach(x=>x.classList.remove('active'));const el=document.querySelector(`.leaf[data-key="${CSS.escape(k)}"]`);if(el){el.classList.add('active');let p=el.parentElement;while(p){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement}el.scrollIntoView({block:'nearest'})}history.push(k);render(n.type,n.o);$('#results').classList.add('hidden')}
function welcome(){const counts=[['MU',DATA.screens.length],['M1',DATA.aggregates.length],['M2',DATA.behaviors.length],['M3',DATA.rules.length],['M5',DATA.roles.length],['M6',DATA.flows.length],['M7',DATA.reports.length]];$('#detail').innerHTML=`<div class="welcome"><span class="badge">MODEL WORKBENCH</span><h2>${esc(DATA.meta.application)}</h2><p>从当前 7 份本体 YAML 构建的可交互知识导航。选择左侧节点，沿真实引用穿透业务设计。</p><div class="model-strip">${counts.map(x=>`<div class="model-box"><b>${x[0]}</b>${x[1]} 项</div>`).join('')}</div><div class="flowline"><span>界面</span><i>→</i><span>操作</span><i>→</i><span>行为</span><i>→</i><span>对象</span><i>→</i><span>规则 / 权限</span><i>→</i><span>报表 / 流程</span></div><div class="notice" style="margin-top:25px">本工作台以 manifest 声明的七模型 YAML 为唯一业务事实源。</div></div>`}
function init(){buildTree();const counts=[['屏幕',DATA.screens.length],['聚合',DATA.aggregates.length],['字典',DATA.dictionaries.length],['关联',DATA.associations.length],['行为',DATA.behaviors.length],['规则',DATA.rules.length],['角色',DATA.roles.length],['权限',DATA.permissions.length],['流程',DATA.flows.length],['报表',DATA.reports.length],['菜单',DATA.menus.length]];$('#stats').innerHTML=counts.map(x=>`<span class="stat">${x[0]}<b>${x[1]}</b></span>`).join('');document.querySelectorAll('.leaf[data-key]').forEach(x=>x.onclick=()=>select(x.dataset.key));welcome()}
$('#expand').onclick=()=>document.querySelectorAll('#tree details').forEach(x=>x.open=true);$('#collapse').onclick=()=>document.querySelectorAll('#tree details').forEach(x=>x.open=false);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Escape')$('#results').classList.add('hidden')});$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase(),box=$('#results');if(!q){box.classList.add('hidden');return}const hits=[...store].filter(([k,n])=>(k+' '+label(n.type,n.o)+' '+JSON.stringify(n.o)).toLowerCase().includes(q)).slice(0,80);box.innerHTML=hits.map(([k,n])=>`<div class="search-hit" data-ref="${esc(k)}">${badge(n.type)}<span>${esc(label(n.type,n.o))}</span><small>${esc(k.split(':').slice(1).join(':'))}</small></div>`).join('')||'<div class="empty">没有匹配节点</div>';box.classList.remove('hidden');box.querySelectorAll('[data-ref]').forEach(x=>x.onclick=()=>select(x.dataset.ref))};init();
</script></body></html>
